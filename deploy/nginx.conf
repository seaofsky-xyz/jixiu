# 设备快速报修 · Nginx 反向代理 + HTTPS
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/repair.conf
#   sudo nano /etc/nginx/conf.d/repair.conf      # 改 server_name 和证书路径
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d baoxiu.example.com   # 自动申请证书（推荐）

server {
    listen 80;
    listen [::]:80;
    server_name baoxiu.example.com;          # ← 改成你的域名

    # certbot 申请证书用的验证目录（certbot --nginx 会自动处理，保留即可）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baoxiu.example.com;          # ← 改成你的域名

    # 证书路径（certbot --nginx 会自动填好；手动上传证书则改成自己的路径）
    ssl_certificate     /etc/letsencrypt/live/baoxiu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baoxiu.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传/请求体上限（报修单是大 JSON，给足）
    client_max_body_size 8m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # 企业微信可信域名校验文件：放 static/ 目录即可被这里带出去
    # 例如 https://baoxiu.example.com/WW_verify_ab12cd34.txt

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
